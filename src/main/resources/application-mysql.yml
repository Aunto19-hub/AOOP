# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Matches the XAMPP default: root user, no password, MySQL/MariaDB on localhost:3306.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/seamline?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
